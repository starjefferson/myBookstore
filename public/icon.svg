<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Blue gradient background box -->
  <rect x="10" y="10" width="80" height="80" rx="12" fill="url(#blueGradient)" />
  
  <!-- Open book icon -->
  <g transform="translate(50, 50)">
    <!-- Book spine (left) -->
    <path d="M -15 -12 L -2 -12 L -2 12 L -15 12 Z" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Book pages (right) -->
    <path d="M 2 -12 L 15 -12 L 15 12 L 2 12 Z" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Page lines -->
    <line x1="3" y1="-8" x2="13" y2="-8" stroke="white" stroke-width="1.5" opacity="0.6" />
    <line x1="3" y1="-3" x2="13" y2="-3" stroke="white" stroke-width="1.5" opacity="0.6" />
    <line x1="3" y1="2" x2="13" y2="2" stroke="white" stroke-width="1.5" opacity="0.6" />
    <line x1="3" y1="7" x2="13" y2="7" stroke="white" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>